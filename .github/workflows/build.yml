name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B package

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: jfr-redact
          path: target/jfr-redact-*.jar
          retention-days: 14
